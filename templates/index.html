<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Basta en Vivo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .pantalla { display: none; background: white; padding: 20px; border-radius: 10px; width: 450px; margin: auto; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        .activa { display: block; }
        input, button { padding: 10px; margin: 5px; width: 90%; box-sizing: border-box;}
        button { background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; transition: 0.3s;}
        button:hover { filter: brightness(0.9); }
        ul { text-align: left; padding: 0; }
        .palabra-item { margin-bottom: 15px; list-style-type: none; padding: 15px; border-radius: 8px; border: 1px solid #ccc; transition: all 0.3s; }
        .boton-peque { width: auto; padding: 5px 10px; margin-top: 10px; font-size: 0.9em; }
    </style>
</head>
<body>

    <div id="pantalla_inicio" class="pantalla activa">
        <h1>Basta en Vivo</h1>
        <input type="text" id="nombre_jugador" placeholder="Tu Nombre">
        <br><br>
        <button onclick="crearSala()">Crear Nueva Sala</button>
        <hr>
        <input type="text" id="codigo_ingreso" placeholder="Código de Sala">
        <button onclick="unirseSala()" style="background-color: #007bff;">Unirse a Sala</button>
    </div>

    <div id="pantalla_lobby" class="pantalla">
        <h2>Sala: <span id="ver_codigo"></span></h2>
        <h3>Jugadores Conectados:</h3>
        <ul id="lista_jugadores" style="padding-left: 40px;"></ul>
        <h3>Categorías para jugar:</h3>
        <ul id="lista_categorias" style="padding-left: 40px;"></ul>
        <div id="controles_host" style="display: none; background: #eee; padding: 10px; border-radius: 5px;">
            <input type="text" id="nueva_categoria" placeholder="Añadir categoría">
            <button onclick="agregarCategoria()">Añadir Categoría</button>
            <br><br>
            <button onclick="iniciarJuego()" style="background-color: #dc3545;">¡INICIAR JUEGO!</button>
        </div>
    </div>

    <div id="pantalla_juego" class="pantalla">
        <h2>Letra de la ronda: <span id="letra_activa" style="font-size: 2em; color: #007bff;">?</span></h2>
        
        <!-- NUEVO: Reloj general visual de 3 minutos -->
        <h3 id="reloj_general" style="color: #6c757d; margin: 10px 0;">
            Tiempo restante: <span id="tiempo_restante" style="color: #28a745; font-weight: bold;">03:00</span>
        </h3>

        <div id="contenedor_categorias" style="text-align: left; margin: 20px 0;"></div>
        <h3 id="mensaje_basta" style="display: none; color: #dc3545;"></h3>
        <h1 id="temporizador" style="display: none; color: red; font-size: 4em; margin: 0;">10</h1>
        <br>
        <button onclick="gritarBasta()" id="btn_basta" style="background-color: #dc3545; font-size: 1.2em; padding: 15px;">
            ¡BASTA PARA MÍ, BASTA PARA TODOS!
        </button>
    </div>

    <div id="pantalla_votacion" class="pantalla">
        <h2>Fase de Revisión</h2>
        <div id="contenedor_votacion" style="text-align: left;"></div>
        <br>
        <div id="controles_votacion_host" style="display: none; margin-top: 20px;">
            <button onclick="cerrarRonda()" style="background-color: #28a745; font-size: 1.1em; padding: 15px;">Confirmar Puntos y Avanzar</button>
        </div>
    </div>

    <div id="pantalla_fin" class="pantalla">
        <h1>¡Fin del Juego!</h1>
        <div id="podio_final" style="background:#fff3cd; padding:20px; border-radius:10px; margin: 20px 0;"></div>
        <button onclick="location.reload()" style="background-color: #007bff;">Jugar de Nuevo</button>
    </div>

    <script>
        const socket = io();
        let miCodigoDeSala = "";
        let soyHost = false;
        let intervaloGeneral = null; // Variable para controlar el reloj visual de 3 minutos

        window.onload = function() {
            const nombreGuardado = sessionStorage.getItem('basta_nombre');
            const codigoGuardado = sessionStorage.getItem('basta_codigo');
            if(nombreGuardado) document.getElementById('nombre_jugador').value = nombreGuardado;
            if(codigoGuardado) document.getElementById('codigo_ingreso').value = codigoGuardado;
        };

        function crearSala() {
            const nombre = document.getElementById('nombre_jugador').value.trim();
            if(!nombre) return alert("Escribe tu nombre");
            
            sessionStorage.setItem('basta_nombre', nombre);
            socket.emit('crear_sala', { nombre: nombre });
        }

        function unirseSala() {
            const nombre = document.getElementById('nombre_jugador').value.trim();
            const codigo = document.getElementById('codigo_ingreso').value.trim();
            if(!nombre || !codigo) return alert("Falta nombre o código");
            
            sessionStorage.setItem('basta_nombre', nombre);
            sessionStorage.setItem('basta_codigo', codigo);
            
            socket.emit('unirse_sala', { nombre: nombre, codigo: codigo });
        }

        function agregarCategoria() {
            const categoria = document.getElementById('nueva_categoria').value;
            if(categoria !== "") {
                socket.emit('agregar_categoria', { codigo: miCodigoDeSala, categoria: categoria });
                document.getElementById('nueva_categoria').value = ""; 
            }
        }

        function iniciarJuego() {
            socket.emit('iniciar_juego', { codigo: miCodigoDeSala });
        }

        function gritarBasta() {
            const nombre = document.getElementById('nombre_jugador').value;
            document.getElementById('btn_basta').disabled = true;
            socket.emit('basta_presionado', { codigo: miCodigoDeSala, nombre: nombre });
        }

        function terminarRonda() {
            document.getElementById('mensaje_basta').innerText = "Enviando respuestas...";
            const inputs = document.querySelectorAll('#contenedor_categorias input');
            let misRespuestas = {}; 
            
            inputs.forEach(input => {
                input.disabled = true; 
                const categoria = input.id.replace('input_', '');
                misRespuestas[categoria] = input.value.trim().toUpperCase(); 
            });
            
            const nombre = document.getElementById('nombre_jugador').value;
            socket.emit('enviar_respuestas', { codigo: miCodigoDeSala, nombre: nombre, respuestas: misRespuestas });
        }

        function votarContra(evaluado, categoria, btn) {
            const miNombre = document.getElementById('nombre_jugador').value;
            if(miNombre === evaluado) return alert("No puedes votar contra tus propias palabras.");
            
            if(btn.style.backgroundColor === "orange") {
                btn.style.backgroundColor = "#dc3545"; 
                btn.innerText = "👎 Rechazar";
            } else {
                btn.style.backgroundColor = "orange";
                btn.innerText = "👎 Votaste";
            }
            socket.emit('votar_contra', { codigo: miCodigoDeSala, evaluado: evaluado, categoria: categoria, votante: miNombre });
        }

        function cambiarPuntos(evaluado, categoria, puntos) {
            socket.emit('forzar_puntos', { codigo: miCodigoDeSala, evaluado: evaluado, categoria: categoria, puntos: puntos });
        }

        function cerrarRonda() {
            socket.emit('cerrar_ronda_y_avanzar', { codigo: miCodigoDeSala });
        }

        socket.on('sala_creada', function(datos) {
            miCodigoDeSala = datos.codigo;
            soyHost = true; 
            mostrarLobby(datos.codigo, datos.sala, true);
        });

        socket.on('ingreso_exitoso', function(datos) {
            miCodigoDeSala = datos.codigo;
            mostrarLobby(datos.codigo, datos.sala, false); 
        });

        socket.on('sala_actualizada', function(sala) {
            actualizarListas(sala);
        });

        socket.on('juego_iniciado', function(datos) {
            document.getElementById('pantalla_lobby').classList.remove('activa');
            document.getElementById('pantalla_votacion').classList.remove('activa');
            document.getElementById('pantalla_juego').classList.add('activa');
            
            document.getElementById('letra_activa').innerText = datos.letra;
            document.getElementById('btn_basta').style.display = 'inline-block';
            document.getElementById('btn_basta').disabled = false;
            document.getElementById('temporizador').style.display = 'none';
            document.getElementById('mensaje_basta').style.display = 'none';
            
            // NUEVO: Arrancar reloj visual de 3 minutos
            if(intervaloGeneral) clearInterval(intervaloGeneral);
            document.getElementById('reloj_general').style.display = 'block';
            let segsRestantes = 180; // 3 minutos
            
            actualizarTextoReloj(segsRestantes);
            intervaloGeneral = setInterval(function() {
                segsRestantes--;
                actualizarTextoReloj(segsRestantes);
                if(segsRestantes <= 0) {
                    clearInterval(intervaloGeneral);
                }
            }, 1000);
            
            const contenedor = document.getElementById('contenedor_categorias');
            contenedor.innerHTML = ""; 
            datos.categorias.forEach(function(cat) {
                contenedor.innerHTML += `
                    <div style="margin-bottom: 10px;">
                        <label><strong>${cat}</strong></label>
                        <input type="text" id="input_${cat}" placeholder="${cat} con ${datos.letra}">
                    </div>`;
            });
        });

        function actualizarTextoReloj(segs) {
            if(segs < 0) segs = 0;
            const mins = Math.floor(segs / 60);
            const rSegs = segs % 60;
            const minsTxt = mins < 10 ? "0" + mins : mins;
            const segsTxt = rSegs < 10 ? "0" + rSegs : rSegs;
            document.getElementById('tiempo_restante').innerText = `${minsTxt}:${segsTxt}`;
        }

        socket.on('iniciar_reloj', function(datos) {
            // NUEVO: Detener y ocultar el reloj general de 3 minutos
            if(intervaloGeneral) clearInterval(intervaloGeneral);
            document.getElementById('reloj_general').style.display = 'none';

            document.getElementById('btn_basta').style.display = 'none';
            document.getElementById('mensaje_basta').innerText = "¡" + datos.quien_fue + " gritó BASTA!";
            document.getElementById('mensaje_basta').style.display = 'block';
            
            const reloj = document.getElementById('temporizador');
            reloj.style.display = 'block';
            reloj.innerText = "10";
            
            let tiempo = 10;
            const intervalo = setInterval(function() {
                tiempo--;
                reloj.innerText = tiempo;
                if(tiempo <= 0) {
                    clearInterval(intervalo); 
                    terminarRonda(); 
                }
            }, 1000);
        });

        socket.on('ir_a_votacion', function(datos_servidor) {
            document.getElementById('pantalla_juego').classList.remove('activa');
            document.getElementById('pantalla_votacion').classList.add('activa');
            
            const contenedor = document.getElementById('contenedor_votacion');
            const respuestas = datos_servidor.respuestas;
            const marcador = datos_servidor.marcador;
            
            const limite = Math.ceil(datos_servidor.total_jugadores / 2);
            
            let html = `<div style='background:#e9ecef; padding:10px; border-radius:5px; margin-bottom:15px; text-align:center;'>
                            <h4>Marcador Actual:</h4><p>`;
            for (const [jugador, puntos] of Object.entries(marcador)) {
                 html += `<strong>${jugador}:</strong> ${puntos} pts &nbsp;&nbsp;`;
            }
            html += `</p></div><p style='color:#dc3545; font-size:0.9em; text-align:center;'>Se necesitan ${limite} votos para tachar una palabra.</p>`;
            
            const jugadores = Object.keys(respuestas);
            if(jugadores.length > 0) {
                const categorias = Object.keys(respuestas[jugadores[0]]);
                categorias.forEach(cat => {
                    html += `<h3 style="color: #007bff; border-bottom: 2px solid #ccc;">${cat}</h3><ul>`;
                    jugadores.forEach(jugador => {
                        const info = respuestas[jugador][cat];
                        const texto = info.texto !== "" ? info.texto : "*(En blanco)*";
                        const puntos_auto = info.puntos_auto;
                        
                        const idSafe = (jugador + "_" + cat).replace(/\s+/g, '_');
                        const id_li = `li_${idSafe}`;
                        const id_span_voto = `span_voto_${idSafe}`;
                        const id_span_pts = `span_pts_${idSafe}`;
                        
                        html += `
                            <li id="${id_li}" class="palabra-item">
                                <strong>${jugador}:</strong> <span style="font-size: 1.3em;">${texto}</span>
                                <span id="${id_span_pts}" style="color: #28a745; font-weight:bold; margin-left:10px;">(${puntos_auto} pts)</span>
                                <br>
                                <button onclick="votarContra('${jugador}', '${cat}', this)" class="boton-peque" style="background-color: #dc3545;">👎 Rechazar</button>
                                
                                <button onclick="cambiarPuntos('${jugador}', '${cat}', 50)" class="boton-peque" style="background-color: #ffc107; color: black; margin-left: 10px;">Vale 50</button>
                                <button onclick="cambiarPuntos('${jugador}', '${cat}', 25)" class="boton-peque" style="background-color: #fd7e14; margin-left: 5px;">Vale 25</button>
                                <button onclick="cambiarPuntos('${jugador}', '${cat}', 100)" class="boton-peque" style="background-color: #17a2b8; margin-left: 5px;">Vale 100</button>
                                
                                <span id="${id_span_voto}" style="color: #dc3545; margin-left: 10px; font-weight:bold; font-size:0.9em;"></span>
                            </li>
                        `;
                    });
                    html += `</ul>`;
                });
            }
            contenedor.innerHTML = html;

            if (soyHost === true) {
                document.getElementById('controles_votacion_host').style.display = 'block';
            }
        });

        socket.on('actualizar_voto', function(datos) {
            const idSafe = (datos.evaluado + "_" + datos.categoria).replace(/\s+/g, '_');
            const li = document.getElementById(`li_${idSafe}`);
            const span = document.getElementById(`span_voto_${idSafe}`);
            
            if(span) span.innerText = datos.num_votos > 0 ? `(${datos.num_votos} votos en contra)` : "";
            
            if(li) {
                if(datos.num_votos >= datos.limite) {
                    li.style.textDecoration = "line-through";
                    li.style.backgroundColor = "#f8d7da";
                    li.style.color = "#721c24";
                } else {
                    li.style.textDecoration = "none";
                    li.style.backgroundColor = "transparent";
                    li.style.color = "black";
                }
            }
        });

        socket.on('actualizar_puntos_UI', function(datos) {
            const idSafe = (datos.evaluado + "_" + datos.categoria).replace(/\s+/g, '_');
            const spanPts = document.getElementById(`span_pts_${idSafe}`);
            
            if(spanPts) {
                spanPts.innerText = `(Forzado: ${datos.puntos} pts)`;
                spanPts.style.color = "#fd7e14"; 
            }
        });

        socket.on('fin_del_juego', function(puntuaciones_finales) {
            document.getElementById('pantalla_votacion').classList.remove('activa');
            document.getElementById('pantalla_juego').classList.remove('activa');
            document.getElementById('pantalla_fin').classList.add('activa');
            
            let html = "<h2>Marcador Final:</h2><ul style='font-size: 1.5em; list-style:none; padding:0;'>";
            const jugadores_ordenados = Object.entries(puntuaciones_finales).sort((a, b) => b[1] - a[1]);
            
            jugadores_ordenados.forEach((dato, index) => {
                let medalla = index === 0 ? "🏆" : "🏅"; 
                html += `<li style="margin-bottom:10px;">${medalla} <b>${dato[0]}:</b> ${dato[1]} pts</li>`;
            });
            
            html += "</ul>";
            document.getElementById('podio_final').innerHTML = html;
        });

        socket.on('error', function(mensaje) { alert(mensaje); });
        
        function mostrarLobby(codigo, sala, esHost) {
            document.getElementById('pantalla_inicio').classList.remove('activa');
            document.getElementById('pantalla_lobby').classList.add('activa');
            document.getElementById('ver_codigo').innerText = codigo;
            if(esHost) document.getElementById('controles_host').style.display = 'block';
            actualizarListas(sala);
        }
        function actualizarListas(sala) {
            document.getElementById('lista_jugadores').innerHTML = sala.jugadores.map(j => `<li>${j}</li>`).join('');
            document.getElementById('lista_categorias').innerHTML = sala.categorias.map(c => `<li>${c}</li>`).join('');
        }
    </script>
</body>
</html>
